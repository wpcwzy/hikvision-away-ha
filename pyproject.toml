[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hikvision-away-ha"
version = "1.0.0"
description = "Home Assistant custom integration: Hikvision NVR away-arm switch"
requires-python = ">=3.12"
dependencies = ["requests>=2.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
